name: Bug report
description: Report a reproducible problem using synthetic data only.
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach a real workspace, contact list, or organization screenshot. Reduce the issue to
        synthetic data under a reserved domain before filing.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: List exact steps and include only a minimal synthetic fixture if needed.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit or release where the problem occurs.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chromium 125 on Linux
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed real organization and personal data from this report.
          required: true
