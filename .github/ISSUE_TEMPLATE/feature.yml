name: Feature request
description: Propose a focused product capability or improvement.
title: "Feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should org-tools solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior rather than a particular implementation.
    validations:
      required: true
  - type: dropdown
    id: data-boundary
    attributes:
      label: Data boundary
      description: Does the proposal keep all organization data in the browser?
      options:
        - Yes
        - Unsure; privacy design is needed
        - No; this changes the product boundary
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or smaller approaches.
