name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @org-tools/screenshots exec playwright install --with-deps chromium

      - name: Check development startup
        run: pnpm dev:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Validate OpenSpec
        run: pnpm spec:validate

      - name: Build production application
        run: pnpm build

      - name: Build GitHub Pages application
        run: pnpm pages:build

      - name: SQLite browser smoke tests
        run: pnpm --filter @org-tools/screenshots smoke

      - name: Pages browser smoke tests
        run: pnpm --filter @org-tools/screenshots pages:smoke

      - name: Generate Pages screenshots
        run: pnpm --filter @org-tools/screenshots generate:pages

      - name: Generate SQLite screenshots
        run: pnpm --filter @org-tools/screenshots generate

      - name: Validate GitHub Pages application
        run: pnpm pages:check

      - name: Check publication safety
        run: pnpm public:check

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: org-tools-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 14
