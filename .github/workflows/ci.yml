name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Initialize isolated environment
        run: |
          ./bin/org-tools env init
          sed -i 's|^ORG_TOOLS_POSTGRES_DATA_PATH=.*|ORG_TOOLS_POSTGRES_DATA_PATH=/tmp/org-tools-ci/postgres|' .env
          sed -i 's|^ORG_TOOLS_BACKUP_PATH=.*|ORG_TOOLS_BACKUP_PATH=/tmp/org-tools-ci/backups|' .env
          mkdir -p /tmp/org-tools-ci/postgres /tmp/org-tools-ci/backups
      - name: Build toolbox and start PostgreSQL
        run: ./bin/org-tools dev -d
      - name: Probe development runtime in Chromium
        run: ./bin/org-tools-dev-check
      - name: Lint
        run: ./bin/org-tools run pnpm lint
      - name: Typecheck
        run: ./bin/org-tools run pnpm typecheck
      - name: Unit and integration tests
        run: ./bin/org-tools run pnpm test:unit
      - name: Validate OpenSpec
        run: ./bin/org-tools run pnpm spec:validate
      - name: Build production application
        run: ./bin/org-tools run pnpm build
      - name: Browser tests
        run: ./bin/org-tools run env ORG_TOOLS_TEST_UPSTREAM_ORIGIN=http://app:3000 pnpm --filter @org-tools/screenshots smoke
      - name: Generate screenshots
        run: ./bin/org-tools run env ORG_TOOLS_TEST_UPSTREAM_ORIGIN=http://app:3000 pnpm --filter @org-tools/screenshots generate
      - name: Publication safety
        run: ./bin/org-tools run pnpm public:check
      - name: Build production image
        run: docker build --tag org-tools:ci .
      - name: Inspect production image
        run: |
          ./bin/org-tools-image-check org-tools:ci
      - uses: actions/upload-artifact@v7
        with:
          name: org-tools-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 14
      - if: always()
        run: ./bin/org-tools down --volumes
