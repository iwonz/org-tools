name: Container

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/iwonz/org-tools
          labels: |
            org.opencontainers.image.title=Org Tools
            org.opencontainers.image.description=Private organization editor with PostgreSQL and RBAC
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=long,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
      - uses: actions/attest@v4
        with:
          subject-name: ghcr.io/iwonz/org-tools
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Verify anonymous pull
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p "${RUNNER_TEMP}/org-tools-anonymous-docker"
          docker --config "${RUNNER_TEMP}/org-tools-anonymous-docker" pull "ghcr.io/iwonz/org-tools:${{ steps.meta.outputs.version }}"
