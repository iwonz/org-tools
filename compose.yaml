name: org-tools

x-runtime-environment: &runtime-environment
  ORG_TOOLS_BACKUP_PATH: /backups
  ORG_TOOLS_DB_HOST: ${ORG_TOOLS_DB_HOST}
  ORG_TOOLS_DB_PASSWORD: ${ORG_TOOLS_DB_PASSWORD}
  ORG_TOOLS_DB_PORT: ${ORG_TOOLS_DB_PORT}
  ORG_TOOLS_DB_SSLMODE: ${ORG_TOOLS_DB_SSLMODE}
  ORG_TOOLS_DB_USER: ${ORG_TOOLS_DB_USER}
  ORG_TOOLS_PORT: ${ORG_TOOLS_PORT}
  ORG_TOOLS_PUBLIC_ORIGIN: ${ORG_TOOLS_PUBLIC_ORIGIN}
  ORG_TOOLS_SETUP_TOKEN: ${ORG_TOOLS_SETUP_TOKEN}
  POSTGRES_DB: ${POSTGRES_DB}

services:
  prepare:
    image: alpine:3.22
    command: ["sh", "-c", "chmod 711 /backups && chown 10001:10001 /backups"]
    restart: "no"
    volumes:
      - type: bind
        source: ${ORG_TOOLS_BACKUP_PATH}
        target: /backups

  db:
    image: postgres:18.6-alpine
    environment:
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${ORG_TOOLS_POSTGRES_DATA_PATH}
        target: /var/lib/postgresql

  migrate:
    image: ${ORG_TOOLS_IMAGE}
    command: ["node", "apps/ui/scripts/migrate-postgres.mjs"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    environment:
      <<: *runtime-environment
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - type: bind
        source: ${ORG_TOOLS_BACKUP_PATH}
        target: /backups

  app:
    image: ${ORG_TOOLS_IMAGE}
    command: ["node", "apps/ui/server.js"]
    cap_drop: ["ALL"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      prepare:
        condition: service_completed_successfully
    environment:
      <<: *runtime-environment
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    ports:
      - "127.0.0.1:${ORG_TOOLS_PORT}:3000"
    read_only: true
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=128m,mode=1777
    volumes:
      - type: bind
        source: ${ORG_TOOLS_BACKUP_PATH}
        target: /backups
    user: "10001:10001"
