schema: spec-driven

context: |
  Product: org-tools, a self-hosted organization editor for one organization with multiple
    authenticated accounts, server-enforced role-based access control, and PostgreSQL persistence.
  Stack: TypeScript, React 19, Next.js, MobX, Radix UI, Tailwind CSS, PostgreSQL, pnpm, Vitest,
    Playwright, Biome, Docker, and Docker Compose.
  Persistence: a strict organization document is stored in PostgreSQL with normalized accounts,
    roles, grants, policies, sessions, per-account UI state, audit records, and identity indexes.
    Clients receive only account-authorized projections and submit strict revision-checked commands.
    Complete recovery uses encrypted Backup and Restore; Data Download and image export remain
    permission-filtered outputs. Public schemas are current-only: changes replace obsolete contracts
    and remove their readers, migrations, fixtures, docs, and tests.
  Privacy: organization data stays inside the configured self-hosted runtime and external local
    PostgreSQL and Backup paths. There is no telemetry, remote logging, remote synchronization,
    remote avatar fetching, or third-party application data service.
  Scale: preserve the interaction target of 20,000 Employees and 4,000 Units through normalized
    state, shared derived indexes, bounded previews, spatial culling, and virtualization.
  Language: the runtime UI supports English, Russian, Spanish, French, Arabic, and Simplified Chinese
    through bundled message catalogs. Source comments, tests, fixtures, specifications, and
    documentation are English; localized product copy belongs only in its matching catalog.
  Workflow: OpenSpec is the sole change registry. Commands run through the repository telemetry
    opt-out wrapper. Documentation and capability specs change with the behavior they describe.

rules:
  proposal:
    - State the user-visible outcome, privacy impact, compatibility impact, and explicit non-goals.
    - Identify changed capabilities and any breaking state or export behavior.
  design:
    - Document data flow, trust boundaries, validation, failure atomicity, and performance effects.
    - Prefer shared components, normalized state, and derived indexes over duplicated render logic.
    - New runtime dependencies require a rationale and a browser privacy assessment.
    - Do not introduce format or schema version fields or backward-compatibility parsing for public
      Org Tools files; replace obsolete contracts and their support code in the same change.
  specs:
    - Use normative SHALL or MUST language and include observable WHEN/THEN scenarios.
    - Specify invalid input, cancellation, and atomic rollback wherever state can change.
    - Keep capability names generic and independent of private systems or historical formats.
  tasks:
    - Group work by independently verifiable outcome and include documentation and tests in the same
      task group as the behavior.
    - End with strict OpenSpec validation, the complete code validation suite, browser smoke,
      screenshot inspection for visible changes, and the public-safety scan.
